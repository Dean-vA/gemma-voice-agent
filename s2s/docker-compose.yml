# The Reachy speech pipeline on a plain Docker host, or locally. (For the cluster: k8s/s2s.yaml.)
#
#   docker compose -f s2s/docker-compose.yml up --build
#
# The G1 connects to ws://<host>:${S2S_PORT:-2740}/v1/realtime. On a host with several GPUs,
# `count: 1` takes the first; replace it with device_ids: ['<index>'] to pin a free one.
services:
  speech:
    build:
      context: ..
      dockerfile: s2s/Dockerfile
    image: ghcr.io/dean-va/s2s-backend:latest
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --voice=${S2S_VOICE:-A friendly young man with a clear, warm voice. He speaks at a relaxed, natural pace, upbeat and a little playful.}
    volumes:
      - s2s-cache:/root/.cache
      - s2s-logs:/srv/logs
    ports:
      - "${S2S_PORT:-2740}:8765"

volumes:
  s2s-cache:
  s2s-logs:
