# Portainer Stack (Git-based, Swarm) — the Reachy speech pipeline, for comparing with the gateway.
#
# The backend the Reachy Mini (Ruxithid) runs on, unchanged, in one container on one GPU:
# Hugging Face's speech-to-speech server doing the turn-taking, Parakeet + TitaNet transcribing,
# Gemma 4 12B (llama.cpp) reading the transcript, Qwen3-TTS speaking. The G1 client connects to
# it instead of the gateway: ws://<node>:32740/v1/realtime (control centre > link >
# "Reachy backend"). The code is copied from the Reachy project; see s2s/README.md.
#
# Written for "Student apps (cluster)": a Swarm API in front of the adsai-rke2 Kubernetes
# cluster (the "d2k translator"). So: a published port in the node-port range, the GPU asked
# for as a Swarm generic resource, and an image from a registry (nothing is built there). The
# image is ghcr.io/dean-va/s2s-backend, built by .github/workflows/s2s-images.yml.
# For a plain Docker host or a local run, use s2s/docker-compose.yml instead.
#
# Deploy: Stacks > Add stack > Repository, this repo, Compose path portainer-s2s.yml.
# Environment variables (all optional):
#   S2S_VOICE   plain-English description of the voice (Qwen3-TTS voice design)
version: "3.8"

services:
  speech:
    image: ghcr.io/dean-va/s2s-backend:latest
    command:
      - --voice=${S2S_VOICE:-A friendly young man with a clear, warm voice. He speaks at a relaxed, natural pace, upbeat and a little playful.}
    ports:
      - "32740:8765"
    volumes:
      - s2s-cache:/root/.cache   # models: Gemma 12B GGUF, Qwen3-TTS, Parakeet, TitaNet, VAD (~15 GB)
      - s2s-logs:/srv/logs       # table_log.py (what was heard and said, per day) and llama.cpp's log
    deploy:
      mode: replicated
      replicas: 1                # the speech server holds one conversation at a time
      restart_policy: {condition: any, delay: 30s}
      resources:
        reservations:
          memory: 24G
          generic_resources:
            - discrete_resource_spec: {kind: NVIDIA-GPU, value: 1}   # about 22 GB of it is used

volumes:
  s2s-cache:
  s2s-logs:
