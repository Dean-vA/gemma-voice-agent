# The Reachy speech pipeline on Kubernetes (the adsai-rke2 cluster), for comparing with the
# gateway: one pod, one GPU (about 22 GB used). The container runs what backend.py runs on
# Windows for the Reachy Mini: llama.cpp (Gemma 4 12B), speaker-aware transcription (Parakeet +
# TitaNet) and the speech server (speech-to-speech + Qwen3-TTS). See s2s/README.md.
#
# Deployed in Portainer as a Git-managed Kubernetes stack on adsai-rke2, namespace "apps"
# (path k8s/s2s.yaml). The image comes from GHCR, built by .github/workflows/s2s-images.yml.
# The G1 connects to ws://<any node>:30740/v1/realtime. A node port must lie in the
# namespace's block (labels buas.nl/port-block-start/end: 30000-32699 for "apps").
#
# Not as a stack on "Student apps (cluster)": that Swarm front end (portainer/d2k) gives
# Swarm services no GPU, only containers started with --gpus.
#
# GPU: the cluster has one KAI shard per node. The pod picks its node with the
# kai.scheduler/node-pool label (lambda-scalar-0: RTX A6000 / 6000 Ada). The cluster's
# kai-team-pods policy then puts it in the platform queue of that node
# (platform-lambda-scalar-0); this stack brings no queue of its own any more.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: s2s-cache, labels: { app: s2s } }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 40Gi } }   # Gemma 12B GGUF, Qwen3-TTS, Parakeet, TitaNet, VAD
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: s2s-logs, labels: { app: s2s } }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }    # table_log.py (heard and said, per day) + llama.cpp log
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: s2s-backend, labels: { app: s2s } }
spec:
  replicas: 1   # the speech server holds one conversation at a time
  strategy: { type: Recreate }
  selector: { matchLabels: { app: s2s } }
  template:
    metadata:
      labels:
        app: s2s
        # Node shard to run in; kai-team-pods derives the queue from it.
        kai.scheduler/node-pool: lambda-scalar-0
        # Ask for protected (non-preemptible) capacity from the platform quota on that node,
        # so a live robot conversation isn't evicted for borrowed work.
        buas.nl/protect: "true"
    spec:
      runtimeClassName: nvidia
      containers:
        - name: backend
          image: ghcr.io/dean-va/s2s-backend:latest
          imagePullPolicy: Always
          args:
            - --voice=A friendly young man with a clear, warm voice. He speaks at a relaxed, natural pace, upbeat and a little playful.
          env:
            # kai-team-pods: "inference" priority rather than build-preemptible, so a live
            # robot conversation isn't evicted for a build job.
            - { name: BUAS_PRIORITY, value: inference }
          ports: [{ containerPort: 8765 }]
          resources:
            limits: { nvidia.com/gpu: 1 }
            requests: { cpu: "4", memory: 24Gi }
          volumeMounts:
            - { name: cache, mountPath: /root/.cache }
            - { name: logs, mountPath: /srv/logs }
          startupProbe:          # the first start downloads about 15 GB of models
            tcpSocket: { port: 8765 }
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            tcpSocket: { port: 8765 }
            periodSeconds: 10
      volumes:
        - { name: cache, persistentVolumeClaim: { claimName: s2s-cache } }
        - { name: logs, persistentVolumeClaim: { claimName: s2s-logs } }
---
apiVersion: v1
kind: Service
metadata: { name: s2s-backend, labels: { app: s2s } }
spec:
  type: NodePort
  selector: { app: s2s }
  # The team policy checks the Service port too, so it carries the block port as well.
  ports: [{ port: 30740, targetPort: 8765, nodePort: 30740 }]
