# Gemma George voice agent on the cluster: Portainer environment
# "Student apps (cluster)", namespace apps.
#
# Port of portainer-stack.yml (Docker stack 1991 on lambda-scalar-0).
# Three deployments, as in the Docker stack. Each asks for a slice of GPU
# memory (annotation gpu-memory, in MiB) instead of a whole card. The apps
# namespace puts them in the platform queue of the node they land on.
#
# Before the first deploy, create the token secret (not in Git):
#   kubectl create secret generic gemma-george-hf -n apps --from-literal=HF_TOKEN=<new token>
#
# Reach it at http://<any node>:30730
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: gemma-george-hf-cache, namespace: apps }
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi
  resources: { requests: { storage: 40Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: gemma-george-asr-clips, namespace: apps }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-csi
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gemma-george-vllm, namespace: apps }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: gemma-george, part: vllm } }
  template:
    metadata:
      labels: { app: gemma-george, part: vllm, kai.scheduler/node-pool: lambda-scalar-0 }
      annotations:
        # The Docker stack held 41.9 GiB only because vLLM pre-allocates 85 % of
        # the card. The model itself is small; 16 GiB leaves room for 8
        # sequences of 8192 tokens. Raise it if vLLM reports too little memory.
        gpu-memory: "16384"
    spec:
      runtimeClassName: nvidia
      # Kubernetes would set VLLM_PORT=tcp://... for the service named vllm,
      # which vLLM reads as its own port setting and then stops.
      enableServiceLinks: false
      containers:
      - name: vllm
        image: ghcr.io/dean-va/gemma-vllm-audio:2026-09-01
        args:
        - --model=google/gemma-4-E4B-it-qat-w4a16-ct
        - --served-model-name=gemma-4-e4b
        - --port=8001
        - --max-model-len=8192
        - --max-num-seqs=8
        # A share of what the container can see. Check at first start whether
        # vLLM sees the 16 GiB slice or the whole 48 GiB card; if it sees the
        # whole card, set this to 0.30.
        - --gpu-memory-utilization=0.90
        - --enable-prefix-caching
        - --async-scheduling
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom: { secretKeyRef: { name: gemma-george-hf, key: HF_TOKEN } }
        ports: [{ containerPort: 8001 }]
        startupProbe:      # the first run downloads the model
          httpGet: { path: /health, port: 8001 }
          periodSeconds: 10
          failureThreshold: 120
        readinessProbe:
          httpGet: { path: /health, port: 8001 }
          periodSeconds: 15
        resources:
          requests: { cpu: "2", memory: 12Gi }
        volumeMounts:
        - { name: hf-cache, mountPath: /root/.cache/huggingface }
        - { name: shm, mountPath: /dev/shm }
      volumes:
      - name: hf-cache
        persistentVolumeClaim: { claimName: gemma-george-hf-cache }
      - name: shm
        emptyDir: { medium: Memory, sizeLimit: 8Gi }
---
apiVersion: v1
kind: Service
metadata: { name: vllm, namespace: apps, labels: { app: gemma-george } }
spec:
  selector: { app: gemma-george, part: vllm }
  ports: [{ port: 8001, targetPort: 8001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gemma-george-tts-kokoro, namespace: apps }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: gemma-george, part: tts-kokoro } }
  template:
    metadata:
      labels: { app: gemma-george, part: tts-kokoro, kai.scheduler/node-pool: lambda-scalar-0 }
      annotations:
        gpu-memory: "3072"     # uses 1.4 GiB in the Docker stack
    spec:
      runtimeClassName: nvidia
      # Kubernetes would set VLLM_PORT=tcp://... for the service named vllm,
      # which vLLM reads as its own port setting and then stops.
      enableServiceLinks: false
      containers:
      - name: tts
        image: ghcr.io/dean-va/gemma-tts-kokoro:2026-09-01
        env:
        - { name: TTS_ENGINE, value: kokoro }
        - name: HF_TOKEN
          valueFrom: { secretKeyRef: { name: gemma-george-hf, key: HF_TOKEN } }
        ports: [{ containerPort: 8200 }]
        startupProbe:
          httpGet: { path: /health, port: 8200 }
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet: { path: /health, port: 8200 }
          periodSeconds: 15
        resources:
          requests: { cpu: "1", memory: 4Gi }
        volumeMounts:
        - { name: hf-cache, mountPath: /root/.cache/huggingface }
      volumes:
      - name: hf-cache
        persistentVolumeClaim: { claimName: gemma-george-hf-cache }
---
# The gateway looks for the TTS engine at http://tts-kokoro:8200 (the Docker
# service name). Check TTS_BASE_URL in app/config.py if it cannot find it.
apiVersion: v1
kind: Service
metadata: { name: tts-kokoro, namespace: apps, labels: { app: gemma-george } }
spec:
  selector: { app: gemma-george, part: tts-kokoro }
  ports: [{ port: 8200, targetPort: 8200 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gemma-george-gateway, namespace: apps }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: gemma-george, part: gateway } }
  template:
    metadata:
      labels: { app: gemma-george, part: gateway, kai.scheduler/node-pool: lambda-scalar-0 }
      annotations:
        gpu-memory: "4096"     # uses 1.8 GiB in the Docker stack (Parakeet, turn detection)
    spec:
      runtimeClassName: nvidia
      # Kubernetes would set VLLM_PORT=tcp://... for the service named vllm,
      # which vLLM reads as its own port setting and then stops.
      enableServiceLinks: false
      containers:
      - name: gateway
        image: ghcr.io/dean-va/gemma-gateway:2026-11-04
        env:
        - { name: BACKEND, value: vllm }
        - { name: VLLM_BASE_URL, value: "http://vllm:8001/v1" }
        - { name: QAT_MODEL_ID, value: google/gemma-4-E4B-it-qat-w4a16-ct }
        - { name: TTS_ENGINE, value: kokoro }
        - { name: MAX_HISTORY_TURNS, value: "8" }
        - { name: SYSTEM_PROMPT, value: "You are a friendly humanoid robot assistant. Reply in short, natural spoken sentences. Be concise and conversational." }
        - name: HF_TOKEN
          valueFrom: { secretKeyRef: { name: gemma-george-hf, key: HF_TOKEN } }
        ports: [{ containerPort: 8000 }]
        readinessProbe:
          tcpSocket: { port: 8000 }
          periodSeconds: 10
        resources:
          requests: { cpu: "2", memory: 6Gi }
        volumeMounts:
        - { name: hf-cache, mountPath: /root/.cache/huggingface }
        - { name: asr-clips, mountPath: /app/samples }
      volumes:
      - name: hf-cache
        persistentVolumeClaim: { claimName: gemma-george-hf-cache }
      - name: asr-clips
        persistentVolumeClaim: { claimName: gemma-george-asr-clips }
---
apiVersion: v1
kind: Service
metadata: { name: gemma-george, namespace: apps, labels: { app: gemma-george } }
spec:
  type: NodePort
  selector: { app: gemma-george, part: gateway }
  ports: [{ port: 30730, targetPort: 8000, nodePort: 30730 }]   # port must be in the apps block 30000-32699
